[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-scanner"
version = "0.1.0"
description = "CLI tool to detect and fix PII leaks in Python codebases and log files"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
pii-scan = "pii_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
